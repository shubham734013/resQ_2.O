name: Dispatch Engine Validation

on:
  push:
    branches:
      - feature/ambulance-dispatch-engine
  pull_request:
    branches:
      - main
      - feature/hospital-directory-data-layer-repair

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm run lint
      - name: Start isolated MongoDB replica set
        run: |
          docker run --detach --name resq-test-mongodb --publish 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec resq-test-mongodb mongosh --quiet --eval 'db.adminCommand("ping").ok' | grep -q 1; then
              break
            fi
            sleep 2
          done
          docker exec resq-test-mongodb mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})' || true
          for attempt in $(seq 1 30); do
            if docker exec resq-test-mongodb mongosh --quiet --eval 'rs.status().ok' 2>/dev/null | grep -q 1; then
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB replica set failed to become ready." >&2
          exit 1
      - name: Run backend tests with replica-set integration enabled
        run: npm test
        env:
          SOS_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/resq_sos_test?replicaSet=rs0
          DISPATCH_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/resq_dispatch_test?replicaSet=rs0
      - run: npm run build
