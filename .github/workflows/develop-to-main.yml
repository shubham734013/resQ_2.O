name: Develop to Main Checks

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    env:
      NODE_ENV: test
      # Throwaway, test-only credentials for the ephemeral container above.
      # They are never valid outside this job.
      MONGODB_URI: mongodb://127.0.0.1:27017/resq_automated_test?replicaSet=rs0&directConnection=true
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/resq_automated_test?replicaSet=rs0&directConnection=true
      JWT_SECRET: ci-test-only-jwt-secret-0123456789abcdef
      JWT_REFRESH_SECRET: ci-test-only-jwt-refresh-0123456789abcdef
      RESQ_ADMIN_EMAIL: admin@resq.test
      RESQ_ADMIN_PASSWORD: ci-test-only-admin-password-123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Start isolated MongoDB replica set
        run: |
          docker run --detach --name resq-test-mongodb --publish 27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec resq-test-mongodb mongosh --quiet --eval 'db.adminCommand("ping").ok' | grep -q 1; then
              break
            fi
            sleep 2
          done
          docker exec resq-test-mongodb mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})' || true
          for attempt in $(seq 1 30); do
            if docker exec resq-test-mongodb mongosh --quiet --eval 'rs.status().ok' 2>/dev/null | grep -q 1; then
              exit 0
            fi
            sleep 2
          done
          echo "MongoDB replica set failed to become ready." >&2
          exit 1
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
